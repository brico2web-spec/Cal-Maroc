<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SBIYAA CAR · إدارة</title>
  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    /* ===== نفس الأنماط السابقة مع تعديلات طفيفة ===== */
    * { margin:0; padding:0; box-sizing:border-box; font-family:'Segoe UI',system-ui,sans-serif; }
    body {
      background: linear-gradient(145deg, #0b1a2e, #1a2f44);
      min-height:100vh; display:flex; align-items:center; justify-content:center; padding:16px;
    }
    .card {
      max-width:500px; width:100%; background:#f5f7fc; border-radius:48px 48px 32px 32px;
      box-shadow:0 30px 50px rgba(0,0,0,0.6); overflow:hidden;
    }
    /* الهيدر مع اللوغو */
    .header {
      background:#102b3f; padding:20px; text-align:center; border-bottom:4px solid #e6b422;
      position:relative;
    }
    .logo-container {
      display:flex; align-items:center; justify-content:center; gap:15px; flex-wrap:wrap;
    }
    .logo-img {
      width:70px; height:70px; border-radius:50%; object-fit:cover;
      border:3px solid #e6b422; background:#f5e7b0; padding:3px;
    }
    .header h1 {
      font-size:2.4rem; font-weight:800; color:#f5e7b0; text-shadow:0 4px 8px rgba(0,0,0,0.6);
      font-family:'Arial Black',sans-serif;
    }
    .header h1 i { color:#f5c542; margin-left:10px; }
    .sub {
      font-size:1.2rem; font-weight:600; color:#bdd1de; background:rgba(0,0,0,0.25);
      display:inline-block; padding:4px 22px; border-radius:40px; margin-top:6px;
      border:1px solid #d4af37;
    }
    /* باقي الأنماط مشابهة للسابق */
    .badge-double { background:#0d1f2e; color:#f0e6c5; padding:12px; display:flex; align-items:center; justify-content:center; gap:12px; flex-wrap:wrap; border-bottom:2px dashed #c9a84c; }
    .cars-showcase { display:flex; justify-content:space-around; padding:20px 12px; background:#eef2f7; flex-wrap:wrap; gap:10px; border-bottom:2px solid #cdd9e6; }
    .car-item { background:white; padding:10px 20px; border-radius:60px; font-weight:700; font-size:1.4rem; color:#0d2b3f; display:flex; align-items:center; gap:10px; border:2px solid #cfb87c; background:#fcf9f0; }
    .car-item i { color:#b8860b; font-size:1.8rem; }
    .phone-section { background:#142b3b; padding:18px 16px; text-align:center; border-bottom:3px solid #e6b422; }
    .phone-row { display:flex; flex-wrap:wrap; align-items:center; justify-content:center; gap:10px 20px; }
    .phone-item { background:#1d384b; padding:10px 18px; border-radius:60px; border:2px solid #dbb05c; display:inline-flex; align-items:center; gap:10px; font-size:1.3rem; font-weight:700; color:#f8f0d5; }
    .phone-item i { color:#f5c542; font-size:1.6rem; }
    .phone-item a { color:inherit; text-decoration:none; direction:ltr; }
    .office-badge { background:#0d1f2c; padding:12px 16px; color:#efe6ca; display:flex; align-items:center; justify-content:center; gap:16px; flex-wrap:wrap; border-bottom:2px solid #b38f40; }
    .office-badge i { color:#f5c542; font-size:1.8rem; }
    .office-badge strong { background:#1f3f55; padding:4px 18px; border-radius:40px; border:1px solid #c9a84c; }
    .footer-note { background:#102433; padding:16px; text-align:center; color:#b7c9d8; border-top:2px solid #b48b36; }
    /* زر الإدارة */
    .admin-btn-container { padding:10px 16px 16px; background:#eef2f7; text-align:center; border-bottom:2px solid #cdd9e6; }
    .btn-admin {
      background:linear-gradient(145deg, #1f3d55, #0d1f2e); color:#f5e7b0; border:2px solid #e6b422;
      padding:12px 32px; border-radius:60px; font-size:1.2rem; font-weight:700; cursor:pointer;
      transition:0.3s; display:inline-flex; align-items:center; gap:12px; box-shadow:0 6px 12px rgba(0,0,0,0.3);
      text-decoration:none;
    }
    .btn-admin:hover { transform:scale(1.03); background:#264f69; border-color:#f5d77b; }
    .btn-admin i { color:#f5c542; font-size:1.6rem; }

    /* ===== صفحة الإدارة (login + لوحة التحكم) ===== */
    .admin-panel {
      display:none; /* مخفي افتراضياً */
      background:#f5f7fc; border-radius:32px; padding:24px; margin-top:20px;
      border:3px solid #e6b422;
    }
    .admin-panel.active { display:block; }
    .login-box, .dashboard-box {
      background:white; border-radius:24px; padding:24px; box-shadow:0 8px 20px rgba(0,0,0,0.1);
    }
    .login-box h2, .dashboard-box h2 {
      color:#0d1f2e; text-align:center; margin-bottom:20px; border-bottom:2px solid #e6b422; padding-bottom:10px;
    }
    .login-box input {
      width:100%; padding:14px; margin:10px 0; border:2px solid #cdd9e6; border-radius:40px;
      font-size:1rem; background:#fafcff; transition:0.2s;
    }
    .login-box input:focus { border-color:#e6b422; outline:none; background:white; }
    .login-box button {
      width:100%; padding:14px; background:#102b3f; color:white; border:none; border-radius:40px;
      font-size:1.2rem; font-weight:700; cursor:pointer; margin-top:10px; transition:0.3s;
    }
    .login-box button:hover { background:#1f4a66; }
    .login-error { color:#c0392b; font-size:0.9rem; text-align:center; margin-top:8px; display:none; }

    /* لوحة التحكم */
    .dashboard-box label { font-weight:600; display:block; margin:15px 0 5px; color:#1f3d55; }
    .dashboard-box input, .dashboard-box textarea {
      width:100%; padding:12px; border:2px solid #cdd9e6; border-radius:30px; font-size:1rem;
    }
    .dashboard-box textarea { height:80px; resize:vertical; }
    .car-preview { display:flex; flex-wrap:wrap; gap:12px; margin:15px 0; }
    .car-preview-item {
      background:#eef2f7; padding:8px 16px; border-radius:40px; border:1px solid #b38f40;
      display:flex; align-items:center; gap:8px;
    }
    .car-preview-item img { width:40px; height:40px; border-radius:50%; object-fit:cover; border:2px solid #e6b422; }
    .dashboard-box .btn-save {
      background:#1f3d55; color:white; border:none; padding:14px; border-radius:40px; width:100%;
      font-size:1.2rem; font-weight:700; margin-top:20px; cursor:pointer; transition:0.3s;
    }
    .dashboard-box .btn-save:hover { background:#2a5a7a; }
    .logout-btn {
      background:transparent; border:2px solid #c0392b; color:#c0392b; padding:8px 20px;
      border-radius:40px; font-weight:700; cursor:pointer; margin-top:16px; transition:0.3s;
    }
    .logout-btn:hover { background:#c0392b; color:white; }

    /* تحسين اللمس */
    @media (max-width:420px) {
      .header h1 { font-size:1.8rem; }
      .logo-img { width:55px; height:55px; }
      .phone-item { font-size:1rem; padding:8px 12px; }
    }
  </style>
</head>
<body>

<div class="card" id="mainCard">
  <!-- ===== الهيدر مع اللوغو ===== -->
  <div class="header">
    <div class="logo-container">
      <!-- ضع رابط اللوغو هنا -->
      <img src="رابط_اللوغو_هنا" alt="SBIYAA CAR" class="logo-img" onerror="this.src='data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%22100%22 height=%22100%22 viewBox=%220 0 100 100%22%3E%3Crect width=%22100%22 height=%22100%22 fill=%22%23102b3f%22/%3E%3Ctext x=%2250%22 y=%2255%22 font-size=%2220%22 text-anchor=%22middle%22 fill=%22%23f5e7b0%22 font-family=%22Arial%22%3ESBIYAA%3C/text%3E%3C/svg%3E'">
      <h1><i class="fas fa-car-side"></i> SBIYAA CAR</h1>
    </div>
    <div class="sub"><i class="fas fa-key"></i> LOCATION DE VOITURES</div>
  </div>

  <!-- بقية البطاقة -->
  <div class="badge-double">
    <i class="fas fa-plane-departure"></i>
    <span>كربا المطاريات</span>
    <i class="fas fa-taxi"></i>
  </div>

  <!-- عرض السيارات (ديناميكي) -->
  <div class="cars-showcase" id="carsContainer">
    <div class="car-item"><i class="fas fa-car"></i> CLIO <small>· 5CV</small></div>
    <div class="car-item"><i class="fas fa-suv"></i> 3008 <small>· SUV</small></div>
  </div>

  <!-- الهواتف -->
  <div class="phone-section">
    <div class="phone-row">
      <div class="phone-item"><i class="fas fa-phone-alt"></i> <a href="tel:+212645213191">06 45 21 31 91</a></div>
      <div class="phone-item"><i class="fas fa-phone-alt"></i> <a href="tel:+212613133130">06 13 13 31 30</a></div>
    </div>
  </div>

  <!-- المكتب -->
  <div class="office-badge">
    <i class="fas fa-building"></i> <span>Bureau N° 2</span> <i class="fas fa-arrow-right"></i> <strong>RDC</strong> <i class="fas fa-door-open"></i>
  </div>

  <!-- زر الإدارة -->
  <div class="admin-btn-container">
    <button class="btn-admin" id="showAdminBtn"><i class="fas fa-user-cog"></i> إدارة الموقع</button>
  </div>

  <!-- ===== صفحة الإدارة (تظهر عند الضغط) ===== -->
  <div class="admin-panel" id="adminPanel">
    <!-- نموذج تسجيل الدخول -->
    <div class="login-box" id="loginBox">
      <h2><i class="fas fa-lock"></i> تسجيل الدخول</h2>
      <input type="text" id="username" placeholder="اسم المستخدم" value="admin">
      <input type="password" id="password" placeholder="كلمة المرور" value="sbiyaa2026">
      <button id="loginBtn">دخول <i class="fas fa-arrow-left"></i></button>
      <div class="login-error" id="loginError">❌ اسم المستخدم أو كلمة المرور غير صحيحة</div>
    </div>

    <!-- لوحة التحكم (تظهر بعد تسجيل الدخول) -->
    <div class="dashboard-box" id="dashboardBox" style="display:none;">
      <h2><i class="fas fa-edit"></i> تعديل المعلومات</h2>
      
      <label><i class="fas fa-car"></i> إضافة سيارة جديدة</label>
      <div style="display:flex; gap:10px; flex-wrap:wrap;">
        <input type="text" id="newCarName" placeholder="اسم السيارة (مثلاً: Duster)" style="flex:2;">
        <input type="text" id="newCarIcon" placeholder="أيقونة (مثلاً: fa-truck)" style="flex:1;">
      </div>
      <label>رابط صورة السيارة</label>
      <input type="text" id="newCarImg" placeholder="https://... (اختياري)">
      <button class="btn-save" id="addCarBtn"><i class="fas fa-plus-circle"></i> إضافة سيارة</button>

      <hr style="margin:25px 0; border:1px dashed #cdd9e6;">

      <label><i class="fas fa-images"></i> معرض السيارات الحالي</label>
      <div class="car-preview" id="carPreviewContainer"></div>

      <label><i class="fas fa-phone"></i> تعديل أرقام الهواتف</label>
      <input type="text" id="editPhone1" value="06 45 21 31 91">
      <input type="text" id="editPhone2" value="06 13 13 31 30">

      <button class="btn-save" id="saveChangesBtn"><i class="fas fa-save"></i> حفظ التعديلات</button>
      
      <button class="logout-btn" id="logoutBtn"><i class="fas fa-sign-out-alt"></i> تسجيل الخروج</button>
    </div>
  </div>

  <!-- فوتر -->
  <div class="footer-note">
    <div><i class="fas fa-clock"></i> 24/7 · مطار محمد الخامس</div>
    <div style="margin-top:4px; font-size:0.85rem;"><i class="fas fa-check-circle" style="color:#d4af37;"></i> كراء سيارات فاخرة · تأمين شامل</div>
  </div>
</div>

<script>
// =============================================
//  إدارة الموقع (Login + تعديل + إضافة سيارات)
// =============================================

// بيانات السيارات الافتراضية (تُحفظ في localStorage)
let carsData = [
  { name: 'CLIO', icon: 'fa-car', img: '' },
  { name: '3008', icon: 'fa-suv', img: '' }
];

// تحميل البيانات المخزنة
function loadCarsFromStorage() {
  const stored = localStorage.getItem('sbiyaa_cars');
  if (stored) {
    try {
      const parsed = JSON.parse(stored);
      if (Array.isArray(parsed) && parsed.length) carsData = parsed;
    } catch(e) {}
  }
}
loadCarsFromStorage();

// عرض السيارات في الواجهة الرئيسية
function renderMainCars() {
  const container = document.getElementById('carsContainer');
  if (!container) return;
  container.innerHTML = carsData.map(car => `
    <div class="car-item">
      <i class="fas ${car.icon || 'fa-car'}"></i> ${car.name}
      ${car.img ? `<img src="${car.img}" style="width:30px;height:30px;border-radius:50%;border:2px solid #e6b422;object-fit:cover;">` : ''}
    </div>
  `).join('');
}

// عرض السيارات في لوحة الإدارة (معاينة)
function renderAdminCars() {
  const container = document.getElementById('carPreviewContainer');
  if (!container) return;
  container.innerHTML = carsData.map((car, index) => `
    <div class="car-preview-item">
      ${car.img ? `<img src="${car.img}" alt="${car.name}">` : `<i class="fas ${car.icon || 'fa-car'}"></i>`}
      <span>${car.name}</span>
      <button onclick="removeCar(${index})" style="background:transparent;border:none;color:#c0392b;cursor:pointer;font-size:1.2rem;">✕</button>
    </div>
  `).join('');
}

// إزالة سيارة
function removeCar(index) {
  if (confirm('هل تريد حذف هذه السيارة؟')) {
    carsData.splice(index, 1);
    localStorage.setItem('sbiyaa_cars', JSON.stringify(carsData));
    renderMainCars();
    renderAdminCars();
  }
}

// إضافة سيارة جديدة
document.getElementById('addCarBtn')?.addEventListener('click', function() {
  const nameInput = document.getElementById('newCarName');
  const iconInput = document.getElementById('newCarIcon');
  const imgInput = document.getElementById('newCarImg');
  const name = nameInput.value.trim();
  const icon = iconInput.value.trim() || 'fa-car';
  const img = imgInput.value.trim();
  if (!name) { alert('الرجاء كتابة اسم السيارة'); return; }
  carsData.push({ name, icon, img });
  localStorage.setItem('sbiyaa_cars', JSON.stringify(carsData));
  nameInput.value = ''; iconInput.value = ''; imgInput.value = '';
  renderMainCars();
  renderAdminCars();
  alert('✅ تم إضافة السيارة بنجاح!');
});

// حفظ التعديلات (الهواتف)
document.getElementById('saveChangesBtn')?.addEventListener('click', function() {
  const phone1 = document.getElementById('editPhone1').value.trim();
  const phone2 = document.getElementById('editPhone2').value.trim();
  if (phone1) {
    document.querySelector('.phone-item a')?.setAttribute('href', `tel:+212${phone1.replace(/\s/g,'')}`);
    document.querySelector('.phone-item a')?.textContent = phone1;
  }
  if (phone2) {
    const links = document.querySelectorAll('.phone-item a');
    if (links.length > 1) {
      links[1].setAttribute('href', `tel:+212${phone2.replace(/\s/g,'')}`);
      links[1].textContent = phone2;
    }
  }
  alert('✅ تم حفظ أرقام الهواتف!');
});

// ===== نظام تسجيل الدخول =====
const adminPanel = document.getElementById('adminPanel');
const loginBox = document.getElementById('loginBox');
const dashboardBox = document.getElementById('dashboardBox');
const loginError = document.getElementById('loginError');

document.getElementById('showAdminBtn')?.addEventListener('click', function() {
  adminPanel.classList.toggle('active');
  // إذا كان مسجلاً دخول مسبقاً، أظهر اللوحة مباشرة
  if (sessionStorage.getItem('sbiyaa_logged') === 'true') {
    loginBox.style.display = 'none';
    dashboardBox.style.display = 'block';
    renderAdminCars();
    // تحميل الهواتف الحالية
    const phoneLinks = document.querySelectorAll('.phone-item a');
    if (phoneLinks.length >= 2) {
      document.getElementById('editPhone1').value = phoneLinks[0].textContent;
      document.getElementById('editPhone2').value = phoneLinks[1].textContent;
    }
  } else {
    loginBox.style.display = 'block';
    dashboardBox.style.display = 'none';
    loginError.style.display = 'none';
  }
});

// زر تسجيل الدخول
document.getElementById('loginBtn')?.addEventListener('click', function() {
  const user = document.getElementById('username').value.trim();
  const pass = document.getElementById('password').value.trim();
  if (user === 'admin' && pass === 'sbiyaa2026') {
    sessionStorage.setItem('sbiyaa_logged', 'true');
    loginBox.style.display = 'none';
    dashboardBox.style.display = 'block';
    loginError.style.display = 'none';
    renderAdminCars();
    // تحميل الهواتف
    const phoneLinks = document.querySelectorAll('.phone-item a');
    if (phoneLinks.length >= 2) {
      document.getElementById('editPhone1').value = phoneLinks[0].textContent;
      document.getElementById('editPhone2').value = phoneLinks[1].textContent;
    }
  } else {
    loginError.style.display = 'block';
  }
});

// تسجيل الخروج
document.getElementById('logoutBtn')?.addEventListener('click', function() {
  sessionStorage.removeItem('sbiyaa_logged');
  loginBox.style.display = 'block';
  dashboardBox.style.display = 'none';
  adminPanel.classList.remove('active');
  alert('تم تسجيل الخروج');
});

// عرض البيانات عند تحميل الصفحة
renderMainCars();

// (اختياري) إذا كان اللوغو مفقوداً، استخدم النص البديل
</script>

</body>
</html>
